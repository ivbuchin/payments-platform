services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pp
      POSTGRES_PASSWORD: pp
    ports: ['${PG_PORT:-5432}:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-databases.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pp']
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports: ['5672:5672', '15672:15672']
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  wallet:
    profiles: [app]
    build: { context: ., args: { SERVICE: wallet-service } }
    environment:
      PORT: 3001
      DATABASE_URL: postgres://pp:pp@postgres:5432/wallet
      AMQP_URL: amqp://guest:guest@rabbitmq:5672
    ports: ['3001:3001']
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health/live').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on: &infra
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  payments:
    profiles: [app]
    build: { context: ., args: { SERVICE: payments-service } }
    environment:
      PORT: 3002
      DATABASE_URL: postgres://pp:pp@postgres:5432/payments
      AMQP_URL: amqp://guest:guest@rabbitmq:5672
      WALLET_URL: http://wallet:3001
      WALLET_KEY_SECRET: ${WALLET_KEY_SECRET:?задайте WALLET_KEY_SECRET (openssl rand -hex 24)}
    ports: ['3002:3002']
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/health/live').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      <<: *infra
      wallet: { condition: service_healthy }

  notifications:
    profiles: [app]
    build: { context: ., args: { SERVICE: notifications-service } }
    environment:
      PORT: 3003
      DATABASE_URL: postgres://pp:pp@postgres:5432/notifications
      AMQP_URL: amqp://guest:guest@rabbitmq:5672
      # Демо: разрешаем вебхуки на частные адреса. В боевом окружении оставить false.
      ALLOW_PRIVATE_WEBHOOK_TARGETS: 'true'
    # Демо-получатель вебхуков запускается на хосте (scripts/smoke.sh); на Linux имя нужно объявить.
    extra_hosts: ['host.docker.internal:host-gateway']
    ports: ['3003:3003']
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3003/health/live').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on: *infra

volumes:
  pgdata:
